# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/micultura
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=MiCulturaSecretKeyForJWT2025MustBeAtLeast256BitsLong!!
# Access token TTL: 15 minutes
app.jwt.access-expiration-ms=900000
# Refresh token TTL: 7 days (default) and 30 days (rememberMe)
app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-remember-expiration-ms=2592000000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Seeding (local/dev only — leave unset or set to false in production)
app.seed.enabled=true
