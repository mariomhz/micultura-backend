# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/micultura
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Local dev uses 'update' so entity changes auto-migrate. Production must
# override with APP_DB_DDL_AUTO=validate (or 'none') and manage schema
# changes through a proper migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${APP_DB_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET}
# Access token TTL: 15 minutes
app.jwt.access-expiration-ms=900000
# Refresh token TTL: 7 days (default) and 30 days (rememberMe)
app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-remember-expiration-ms=2592000000

# CORS
app.cors.allowed-origins=http://localhost:3000

# Seeding (local/dev only — leave unset or set to false in production)
app.seed.enabled=true
