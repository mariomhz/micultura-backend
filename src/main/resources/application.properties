# Server — Render/Railway/Fly inject PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# PostgreSQL
# Either set SPRING_DATASOURCE_URL directly (local dev) or DB_HOST/DB_PORT/DB_NAME
# components (Render's Blueprint exposes them this way — its `connectionString`
# property is postgres:// rather than the jdbc:postgresql:// JDBC needs).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:micultura}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Local dev uses 'update' so entity changes auto-migrate. Production must
# override with APP_DB_DDL_AUTO=validate (or 'none') and manage schema
# changes through a proper migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${APP_DB_DDL_AUTO:update}
spring.jpa.show-sql=${APP_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${APP_JWT_SECRET}
# Access token TTL: 15 minutes
app.jwt.access-expiration-ms=900000
# Refresh token TTL: 7 days (default) and 30 days (rememberMe)
app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-remember-expiration-ms=2592000000

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Cookies — set both to enable cross-site auth (frontend on a different domain).
app.security.cookie-secure=${APP_SECURITY_COOKIE_SECURE:false}
app.security.cookie-same-site=${APP_SECURITY_COOKIE_SAME_SITE:Lax}

# Seeding — defaults to true for local dev convenience. Set APP_SEED_ENABLED=false
# in production once the prod database has been populated.
app.seed.enabled=${APP_SEED_ENABLED:true}

# Gemini AI search — free tier key from https://ai.google.dev/. Empty by
# default so the app still boots without it; the /api/search/ai endpoint
# returns 503 until a key is configured.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
